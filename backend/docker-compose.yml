services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jofran
      POSTGRES_PASSWORD: jofran
      POSTGRES_DB: jofran_dev
    ports:
      - "5432:5432"
    volumes:
      - jofran_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - jofran_redis_data:/data

volumes:
  jofran_pg_data:
  jofran_redis_data:
