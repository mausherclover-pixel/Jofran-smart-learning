name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No live database is needed here — prisma generate only reads
      # schema.prisma to produce the typed client, it never connects.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # Every test in this suite is a unit test against pure functions and
      # mocked dependencies (see docs/07_Backend_Development.md) — no
      # Postgres/Redis service container is needed to run it in CI.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
